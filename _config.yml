# Site settings
title: "Yida Wang's Home Page"
description: "Yida Wang@NVIDIA"
url: "https://www.yidawang.org"
baseurl: ""

# Author
author: "Yida Wang"
keywords: "wang, yida, nvidia, compiler, agent, mlsys, ai, princeton, parallel computing, hpc"

# Profile image
me-img: "/img/yida.jpg"

# Favicon
favicon: "/img/nvidia.ico"

# Build settings
markdown: kramdown
highlighter: rouge

# GitHub Pages compatible plugins
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude files from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  # about.md has no front matter, so without this it gets copied to the
  # site as a raw, unstyled /about.md file. It's only meant to be pulled
  # in via {% include_relative about.md %} from index.md.
  - about.md

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
      # jekyll-seo-tag only reads `image` from page data, not from top-level
      # site config, so set it here to get a default og:image/twitter:image
      # on every page.
      image: "/img/yida.jpg"

# Navigation
navigation:
  - title: About
    url: /#about
  - title: Contact
    url: /#footer-contact

# Social links
social:
  - title: "linkedin"
    url: "https://www.linkedin.com/in/yida-wang-4a4816125"
  - title: "github"
    url: "https://github.com/yidawang"
  - title: "book"
    url: "https://scholar.google.com/citations?user=NvBZp6MAAAAJ&hl=en"

# Google Analytics 4
google-analytics: "G-1411GQW7M1"

# Bravenet counter
bravenet-count: true